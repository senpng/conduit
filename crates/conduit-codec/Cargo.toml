[package]
name = "conduit-codec"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-ir = { path = "../conduit-ir" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
insta = { version = "1", features = ["json"] }
proptest = "1"
tokio = { version = "1", features = ["full"] }
