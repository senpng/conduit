[package]
name = "conduit-pipeline"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-ir = { path = "../conduit-ir" }
conduit-codec = { path = "../conduit-codec" }
conduit-router = { path = "../conduit-router" }
conduit-upstream = { path = "../conduit-upstream" }
conduit-oauth = { path = "../conduit-oauth" }
conduit-trace = { path = "../conduit-trace" }
conduit-quota = { path = "../conduit-quota" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full", "sync"] }
tracing = "0.1"
futures = "0.3"
ulid = "1"
chrono = { version = "0.4", features = ["serde"] }
secrecy = { version = "0.8", features = ["serde"] }
tokio-util = { version = "0.7", features = ["io"] }
arc-swap = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "sync", "macros", "rt-multi-thread"] }
tempfile = "3"
async-trait = "0.1"
