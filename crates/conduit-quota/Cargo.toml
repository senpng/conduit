[package]
name = "conduit-quota"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-ir = { path = "../conduit-ir" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full", "sync"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["full"] }
