[package]
name = "conduit-secret"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-ir = { path = "../conduit-ir" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
secrecy = { version = "0.8", features = ["serde"] }
zeroize = { version = "1", features = ["derive"] }
argon2 = "0.5"
aes-gcm = "0.10"
keyring = { version = "2" }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
