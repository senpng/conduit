[package]
name = "conduit-store"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-ir = { path = "../conduit-ir" }
conduit-router = { path = "../conduit-router" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "migrate", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
futures = "0.3"
