[package]
name = "conduit-upstream"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-ir = { path = "../conduit-ir" }
conduit-codec = { path = "../conduit-codec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "stream", "json"] }
# Chrome TLS/JA3/HTTP2 fingerprint for Claude OAuth (CLIProxyAPI utls HelloChrome_Auto)
wreq = { version = "6.0.0-rc.29", features = ["json", "stream", "gzip", "brotli", "deflate"] }
wreq-util = "3.0.0-rc.14"
eventsource-stream = "0.2"
futures = "0.3"
pin-project-lite = "0.2"
secrecy = { version = "0.8", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
regex = "1"
rand = "0.8"
base64 = "0.22"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full"] }
