[package]
name = "conduitd"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "conduitd"
path = "src/main.rs"

[dependencies]
conduit-ir = { path = "../conduit-ir" }
conduit-codec = { path = "../conduit-codec" }
conduit-router = { path = "../conduit-router" }
conduit-upstream = { path = "../conduit-upstream" }
conduit-pipeline = { path = "../conduit-pipeline" }
conduit-quota = { path = "../conduit-quota" }
conduit-secret = { path = "../conduit-secret" }
conduit-store = { path = "../conduit-store" }
conduit-oauth = { path = "../conduit-oauth" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
clap = { version = "4", features = ["derive", "env"] }
ulid = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
secrecy = { version = "0.8", features = ["serde"] }
toml = "0.8"
blake3 = "1"
hex = "0.4"
arc-swap = "1"
async-stream = "0.3"
async-trait = "0.1"
parking_lot = "0.12"
reqwest = { workspace = true }

[dev-dependencies]
tempfile = "3"
